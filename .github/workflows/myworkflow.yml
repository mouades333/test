
name: My Android CI

'on':
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build APK
        run: ./gradlew assembleDebug

